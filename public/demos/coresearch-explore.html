<html lang="zh-CN">
<head>

<title>CoResearch · 研究工作台演示</title>
<style>
*{box-sizing:border-box} html,body{margin:0;height:100%;background:#19191a;color:#ebebec}
body{font:12px/1.65 "SF Pro Text","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;container-type:inline-size}
:root{--quiet:#a3a4a8;--line:#262627;--card:#181819;--hit:#242425;--violet:#5549e9}
button,textarea{font:inherit;color:inherit}button{background:transparent;border:0;cursor:pointer;padding:0}button:hover{background:#29292b}button:focus-visible,textarea:focus-visible,svg [tabindex]:focus-visible{outline:1px solid #9a92fa;outline-offset:2px}button:disabled{opacity:.55;cursor:default}

.layout.hide-side{grid-template-columns:0 minmax(0,1fr)}.hide-side .sidebar{visibility:hidden}

.ico,.toolbar button{display:inline-grid;place-items:center;width:2em;height:2em;border-radius:.42em;color:#bbbcc0;flex:none}
.side-nav{padding:0 .65em .33em;border-bottom:1px solid var(--line)}.nav-row{display:flex;align-items:center;gap:.9em;width:100%;padding:.32em .66em;border-radius:.52em;white-space:nowrap;text-align:left}.new{margin:.35em .65em;width:auto}
.side-label,.account{display:flex;align-items:center;justify-content:space-between;padding:.42em 1.15em}.side-label{font-size:.86em}.sessions{flex:1;min-height:0;overflow:auto;padding:0 .72em .5em;scrollbar-width:thin}.folder,.folder-sub{display:flex;align-items:center;gap:.45em;white-space:nowrap;text-align:left;min-width:0;width:100%;padding:.25em .3em}.folder-sub{color:var(--quiet);padding-left:1.1em;font-size:.9em}
.session{display:block;width:calc(100% - 1.34em);margin:.09em 0 .09em 1.34em;text-align:left;padding:.13em .62em;border-radius:.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session.active{background:var(--hit)}.session.nest{margin-left:2.45em;width:calc(100% - 2.45em);font-size:.91em}.clip{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account{height:3.35em;border-top:1px solid var(--line);color:var(--quiet);gap:.65em}
.workspace{display:grid;grid-template-columns:minmax(0,45.3fr) minmax(0,54.7fr);min-width:0;min-height:0;padding:.6em;gap:.6em}.workspace.disk-wide{grid-template-columns:minmax(0,30fr) minmax(0,70fr)}.workspace.disk-only{grid-template-columns:minmax(0,1fr)}.disk-only .chat{display:none}
.pane{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:1em;background:var(--card)}
.tabbar{height:3.55em;flex:none;display:flex;align-items:center;gap:.45em;padding:0 .9em;border-bottom:1px solid #222223;overflow:hidden}
.tab{display:flex;min-width:0;align-items:center;gap:.55em;padding:.33em .66em;border-radius:.58em;white-space:nowrap;color:#adadb1}.tab.selected{border:1px solid #242426;color:#ededee}.tabbar .muted{color:#86868b}.graph-tab{min-width:14em}.toolbar{display:flex;gap:.33em;align-items:center}
.messages{flex:1;overflow:auto;min-height:0;padding:0 1.9em;scrollbar-width:thin;scrollbar-color:#333 transparent;overscroll-behavior:contain}
.bubble{background:#202021;padding:.59em 1em;border-radius:1.44em;max-width:90%;width:max-content;margin:1em 0 1.9em auto;line-height:1.55}.messages p{margin:0 0 1.03em}.meta{color:var(--quiet);display:flex;align-items:center;gap:.55em;margin:.5em 0 .62em}.meta.rule{border-bottom:1px solid #242425;padding-bottom:.5em;margin-bottom:2.3em}.spacer{height:2.4em}.group{display:flex;justify-content:space-between;align-items:center;gap:.8em;margin:0 0 .85em;padding:.66em .8em;border:1px solid #2a2a2b;border-radius:.8em}.group button{border:1px solid #2d2d2e;border-radius:.5em;padding:.09em .6em;white-space:nowrap;font-size:.84em}.group.attention{border-color:#666080}
.result-list{display:grid;gap:.35em;margin:.6em 0 1em}.result-list button{text-align:left;padding:.48em .72em;border:1px solid #2a2a2e;border-radius:.5em}.result-list button[aria-pressed=true]{border-color:#77747f;background:#222225}
.composer{margin:.65em 1.03em 1.04em;padding:.85em 1em .65em;border:1px solid #2a2a2b;border-radius:1.45em;background:#19191a}.source{margin:0 0 .65em;padding:.25em .65em;border:1px solid #2c2c2e;background:#202021;border-radius:.6em;color:#a5a5a9;font-size:.83em}.composer textarea{display:block;background:transparent;border:0;resize:none;width:100%;height:3.25em;padding:.25em .1em;scrollbar-width:thin;line-height:1.45}.composer textarea::placeholder{color:var(--quiet)}.composer footer{display:flex;align-items:center;gap:.7em;white-space:nowrap;font-size:.88em}.composer small{color:var(--quiet);font-size:.9em}.composer .model{max-width:45%}.send{display:grid;place-items:center;height:2.55em;width:2.55em;border-radius:.8em;background:#f0f0f0;color:#161617;flex:none}.send:not(:disabled):hover{background:#d4cdf8}.control-chip{padding:.12em .48em;border-radius:.4em}.draft{color:#d0c5ef;font-size:.85em;margin-bottom:.25em}.draft button{margin-left:.5em;color:inherit}
.graph-title{display:flex;align-items:center;gap:.55em;height:2.35em;flex:none;padding:0 1.1em;border-bottom:1px solid #222223;font-size:.89em}.graph-tools{display:flex;justify-content:end;align-items:end;height:3.2em;flex:none;padding-right:.73em}
.segments{display:flex;width:max-content;border:1px solid #39393c;border-radius:.55em;background:#29292b;overflow:hidden;color:#babcbe;font-size:.87em;white-space:nowrap}.segments button{padding:.19em .57em;display:flex;gap:.35em;align-items:center}.segments button[aria-pressed=true]{background:#424244;color:#f7f7f8}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;margin:0 .65em .6em;border:1px solid #29292b;border-radius:.73em;background:#0d0e12;background-image:radial-gradient(ellipse at 48% 48%,#121316,transparent 76%)}
#chart{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:pan-y;user-select:none}.stage .segments{position:absolute;top:.75em;left:.73em}.stage text{pointer-events:none}.stage [data-node]{cursor:pointer}.stage [data-node]:hover .face,.stage [data-node]:focus-visible .face{filter:brightness(1.38);stroke:#98979a}
.mini{position:absolute;bottom:1.35em;right:1.3em;display:grid;justify-items:center;gap:.38em;color:#99999e;font-size:.68em;background:transparent!important;min-width:90px}.mini svg{width:10.1em;height:10.1em}.actions{position:absolute;bottom:.55em;left:.7em;display:flex;flex-direction:column;gap:.73em;max-width:calc(100% - 8.3em);font-size:.87em}.action-row{display:flex;flex-wrap:wrap;gap:.65em}.actions button{padding:.25em .65em;border-radius:.53em;white-space:nowrap}.actions button:first-child,.inspect{background:#1f1f21;border:1px solid #2f2f32}.inspect{align-self:start}.inspector{position:absolute;z-index:2;bottom:5.15em;left:.7em;width:min(270px,calc(100% - 1.4em));padding:1em;background:#202023;border:1px solid #3b3b41;border-radius:.65em}.inspector p{margin:.35em 0;color:#bbbcc1}
.drawer{background:#202023;border:1px solid #37373e;border-radius:.65em;padding:1em;position:absolute;z-index:4;left:1em;top:4em;width:min(225px,calc(100% - 2em))}.drawer label,.drawer button{display:block;margin-bottom:.56em}.drawer input{max-width:100%;background:#17171a;border:1px solid #555;color:white;padding:.4em}
.mobile-nav{display:none}.overlay-control{position:absolute;z-index:3;right:1.5em;bottom:1.4em;font-size:.87em}.overlay-control:hover{background:#333}
@media(max-width:720px){.layout,.layout.hide-side{display:flex;flex-direction:column;font-size:12px}.sidebar{display:none}.workspace{flex:1;display:flex;padding:.4em;gap:0}.pane{width:100%}.layout[data-mobile=chat] .graph,.layout[data-mobile=graph] .chat{display:none}.mobile-nav{height:3em;display:flex;align-items:center;gap:.4em;padding:0 .65em;border-bottom:1px solid #303033}.mobile-nav button{padding:.17em .55em;border-radius:.4em}.mobile-nav [aria-pressed=true]{background:#39393c}.messages{padding:0 1em}.tabbar{padding:0 .5em}.tabbar .hide-narrow,.graph-tools .hide-narrow,.composer .hide-narrow{display:none}.composer footer{gap:.3em}.mini{right:.5em;bottom:.75em;min-width:0}.mini svg{width:7em;height:7em}.mobile-nav strong{margin-right:auto;white-space:nowrap}.action-row{gap:.18em}.actions{max-width:calc(100% - 6.3em)}.actions button{padding:.25em .4em}.toolbar{gap:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
/* Product-page presentation only. The standalone and homepage keep their own UI. */
html.showcase,html.showcase body{background:#fafafa;color:#202125;color-scheme:light}
.showcase{--quiet:#62656e;--line:#ececf0;--card:#fff;--hit:#eeeeef;--violet:#4f46e5}
.showcase .layout{font-size:clamp(10px,.92cqw,13px)}
.showcase .sidebar{background:#f7f8fa;color:#25262a}
.showcase .sidebar .account,.showcase .folder-sub{color:#62656e}
.showcase .fixture-project{margin-bottom:.54em}
.showcase .fixture-project .folder{gap:.36em;font-weight:590}
.showcase .fixture-project .folder .icon,.showcase .fixture-session .icon{width:1.02em;height:1.02em;flex:none}
.showcase .fixture-count{margin-left:auto;font-size:.8em;color:#646977;font-variant-numeric:tabular-nums}
.showcase .fixture-session{display:flex;gap:.44em;align-items:center;padding:.37em .44em;margin:.1em 0 .1em .65em;border-radius:.45em;color:#4f5360;white-space:nowrap}
.showcase .fixture-session.current{background:#e9edf8;color:#253c6e;font-weight:620}
.showcase .fixture-session.current>.icon{color:#405d9c}
.showcase .fixture-session.child{margin-left:1.28em;position:relative;color:#545e75;font-size:.94em}
.showcase .fixture-session.child[hidden]{display:none}
.showcase .fixture-session.child.ready{background:#eef2fb;color:#25477c}
.showcase .fixture-session.child.ready>.icon{color:#496ca8}
.showcase .fixture-session .clip{flex:1}
.showcase .fixture-tab.current{flex:0 1 auto}
.showcase .fixture-tab.muted{flex:1 1 0;max-width:11em}
.showcase .brand strong{color:#23232a}
.showcase .workspace{background:#fafafa}
.showcase .tabbar,.showcase .graph-title{border-color:var(--line);color:#36383e}
.showcase .tab,.showcase .ico,.showcase .toolbar button{color:#646770}
.showcase .tab.selected{color:#24262c;border-color:#e8e9ed;background:#fafafa}
.showcase .tabbar .muted{color:#666872}
.showcase .messages{position:relative;padding:.95em 1.9em .2em;scrollbar-width:none}
.showcase .bubble{background:#f3f4f6;color:#23252a;margin:.1em 0 1.45em auto;padding:.67em 1em;border:1px solid #f0f0f3}
.showcase .composer{background:#fff;border-color:#e2e4e9;margin:.65em 1.03em 1.04em}
.showcase .composer footer{color:#525660}
.showcase .composer .source{background:#f6f7f9;border-color:#e9ebef;color:#535761}
.showcase .draft{color:#365caa}
.showcase .send{background:#272a31;color:#fff}
.showcase .send:disabled{background:#e9eaec;color:#585b63;opacity:1}
.showcase .segments{border-color:#e1e2e6;background:#f4f4f6;color:#555863}
.showcase .segments button[aria-pressed=true]{background:#e6e7eb;color:#202227}
.showcase .stage{
 background-color:#f8fafc;
 background-image:radial-gradient(ellipse at 38% 50%,#ffffffa6,transparent 75%),radial-gradient(circle,#aab9ce50 .8px,transparent 1px);
 background-size:100% 100%,18px 18px;
 border-color:#e1e7ef;isolation:isolate;
 --dial-ring:#c9d4e2;--dial-major:#7c90ab;--dial-minor:#bac8da;
 --dial-dot:#879bb8;--dial-selected-start:#edf4ff;--dial-selected-end:#d6e5fa;
 --dial-bezel:#e7edf5;--dial-overview-panel:#f3f6fa;--dial-overview-line:#b0bed1;
 --dial-background:#fff;--dial-hub-line:#879bb6;--dial-neutral:#f4f7fb;--dial-neutral-line:#c4d0df;
 --dial-selected-line:#6487ba;--dial-ink:#263858;--dial-muted:#52647f;
 --dial-micro:#596a81;--dial-accent:#45699e;--dial-connector:#6689bb;
 --dial-child:#eaf2fd;--dial-child-line:#8faed1;
}
.showcase .stage>.segments{background:#fffffff0;border-color:#d9e1ec;color:#4b596f}
.showcase .stage>.segments button[aria-pressed=true]{background:#e6edf7;color:#293d61}
.showcase .mobile-nav{display:none}
.showcase #chart{overflow:hidden;touch-action:auto}
.showcase .stage .mini{z-index:1;color:#4b5d76}
.showcase .stage .actions{color:#3d4b61}
.showcase .stage .actions button:first-child,.showcase .stage .inspect{background:#fff;border-color:#d7e0ed}
.showcase .compare-receipt{display:flex;align-items:center;justify-content:space-between;gap:.5em;border:1px solid #ececf0;border-radius:.7em;padding:.5em .7em;margin:0 0 .62em;color:#292b30}
.showcase .compare-receipt span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.showcase .compare-receipt b{font-weight:560;white-space:nowrap;padding:.18em .55em;border-radius:.4em;border:1px solid #e3e5e9;font-size:.82em}
.showcase .agent-kicker{display:flex;align-items:center;gap:.45em;color:#5a5d65;margin-bottom:.56em}
.showcase .agent-kicker i{display:none}
.showcase .show-copy{color:#25272c;line-height:1.58;margin-bottom:.62em}
.showcase .show-prose{color:#32353c;line-height:1.64;margin-top:.9em}
.showcase .show-prose p{margin:0 0 .88em}
.showcase .show-prose ul{margin:.25em 0 .95em;padding-left:1.5em}
.showcase .show-prose li+li{margin-top:.38em}
.showcase .show-prose .meta{margin:.65em 0 .46em}
.showcase .wait-pips{display:inline-flex;gap:.24em;align-items:center;margin-left:.36em}
.showcase .wait-pips b{width:.36em;height:.36em;border-radius:50%;background:#788397;animation:breathe .9s ease-in-out infinite alternate}
.showcase .wait-pips b:nth-child(2){animation-delay:.16s}.showcase .wait-pips b:nth-child(3){animation-delay:.32s}
.showcase .show-list{display:grid;gap:.4em}
.showcase .show-item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.58em;padding:.53em .66em;border:1px solid #e8eaf0;border-radius:.58em;background:#fcfcfd;color:#272a32}
.showcase .show-item small{display:block;color:#5e6470;font-size:.83em}
.showcase .show-item em{font-size:.72em;color:#345aa6;font-style:normal;white-space:nowrap}
.showcase .show-item strong{display:block;line-height:1.35}
.showcase .show-item .index{display:grid;place-items:center;width:1.75em;height:1.75em;border-radius:5px;background:#eff0f3;color:#666c75;font-size:.85em;font-variant-numeric:tabular-nums}
.showcase .show-item.active{border-color:#c4d3ee;background:#f1f5fd}
.showcase .show-item.active .index{background:#e4ecfb;color:#345895}
.showcase .show-item.child{background:#f9fafc;border-color:#e6e9f0}
.showcase .show-branch{margin-top:.72em;padding-left:.72em;border-left:2px solid #c6d4ed;color:#303743}
.showcase .show-branch>b{display:block;margin-bottom:.36em}
.showcase .overview-scene,.showcase .focus-scene{transform-origin:325px 356px}
.showcase .overview-scene{opacity:0;visibility:hidden}
.showcase [data-phase="0"] .overview-scene{opacity:.34;visibility:visible}
.showcase [data-phase="1"] .overview-scene{visibility:visible;animation:form-wheel .68s cubic-bezier(.2,.8,.2,1) both}
.showcase [data-phase="0"] .focus-scene,.showcase [data-phase="1"] .focus-scene{visibility:hidden}
.showcase [data-phase="2"] .focus-scene{animation:camera-enter .66s cubic-bezier(.19,.76,.24,1) both}
.showcase .focus-scene .expansion{visibility:hidden}
.showcase [data-phase="3"] .focus-scene .expansion{visibility:visible}
.showcase [data-phase="3"] .leaf-preview{visibility:hidden}
.showcase [data-phase="3"] .branch-edge{stroke-dasharray:1;stroke-dashoffset:1;animation:trace .67s cubic-bezier(.16,1,.3,1) forwards}
.showcase [data-phase="3"] .child-sector{animation:reveal-branch .58s cubic-bezier(.18,.74,.23,1) .16s both;transform-origin:232px 356px}
.showcase [data-phase="3"] .child-second{animation-delay:.30s}
.showcase .show-enter{animation:enter .36s cubic-bezier(.22,.68,.32,1) both}
.showcase .show-item.show-enter:nth-child(2){animation-delay:.10s}
.showcase [data-play="paused"] *{animation-play-state:paused!important}
@keyframes camera-enter{from{opacity:0;transform:translateX(38px) scale(.89)}to{opacity:1;transform:none}}
@keyframes breathe{from{opacity:.32;transform:translateY(1px)}to{opacity:1;transform:translateY(-1px)}}
@keyframes form-wheel{from{opacity:0;transform:scale(.89)}to{opacity:1;transform:scale(1)}}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes reveal-branch{from{opacity:0;transform:scale(.78)}to{opacity:1;transform:scale(1)}}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:720px){
 .showcase .layout{font-size:11.5px}
 .showcase .workspace{display:grid;grid-template-columns:1fr;grid-template-rows:170px minmax(0,1fr);padding:.44em;gap:.4em}
 .showcase .layout[data-mobile] .chat,.showcase .layout[data-mobile] .graph{display:flex}
 .showcase .tabbar{height:2.35em}
 .showcase .chat .tabbar .ico,.showcase .chat .tabbar .fill,.showcase .toolbar,.showcase .graph .tabbar>i,.showcase .composer footer,.showcase .composer .source,.showcase .graph-tools,.showcase .graph-title,.showcase .stage .mini,.showcase .stage .actions{display:none}
 .showcase .messages{padding:.55em .7em 0;line-height:1.35}
 .showcase .bubble{margin:.08em 0 .5em auto;padding:.34em .7em}
 .showcase .composer{margin:.3em .65em .5em;padding:.28em .55em}
 .showcase .composer textarea{height:1.45em;line-height:1.3;padding:0}
 .showcase .composer #pin{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}
 .showcase .composer #pin button,.showcase .show-item small,.showcase .compare-receipt,.showcase .show-prose,.showcase .desktop-context{display:none}
 .showcase .agent-kicker{margin-bottom:.25em}
 .showcase .show-copy{font-size:11px;margin-bottom:.38em}
 .showcase .show-list{gap:.25em}
 .showcase .show-item{padding:.25em .45em}
 .showcase .show-item strong{font-size:.93em}
 .showcase .show-branch{margin-top:.32em}
 .showcase [data-phase="1"] .messages>.bubble,
 .showcase [data-phase="3"] .messages>.show-enter:not(.show-branch),
 .showcase [data-phase="3"] .messages>.show-list .show-item:not(.active){display:none}
 .showcase .stage{margin:.36em}
 .showcase .stage>.segments{top:.42em;left:.55em}
}
</style>
</head>
<body>
<div class="layout" id="layout" data-mobile="chat">
 <nav class="mobile-nav" aria-label="切换演示面板"><strong>CoResearch</strong><button type="button" data-mobile-tab="chat" aria-pressed="true">研究对话</button><button type="button" data-mobile-tab="graph" aria-pressed="false">研究图谱</button></nav>
 <aside class="sidebar" aria-label="会话与项目">
  <div class="brand"><span class="brand-mark" data-icon="book-open"></span><strong>CoResearch</strong><span class="fill"></span><button type="button" class="ico" data-action="sidebar" data-icon="panel-left" aria-label="收起侧栏"></button></div>
  <nav class="side-nav" aria-label="工作台导航">
   <button type="button" class="nav-row" data-action="home"><i data-icon="house"></i>首页</button><button type="button" class="nav-row" data-action="search"><i data-icon="search"></i>搜索</button>
   <button type="button" class="nav-row" data-action="radar"><i data-icon="radar"></i>论文雷达</button><button type="button" class="nav-row" data-action="browse"><i data-icon="layout-grid"></i>浏览</button>
  </nav>
  <button class="nav-row new" type="button" data-action="reset"><i data-icon="plus"></i>新建会话</button>
  <div class="side-label"><b>项目</b><i data-icon="folder-plus"></i></div>
  <div class="sessions"><button type="button" class="folder" data-action="project" aria-expanded="true"><i data-icon="folder"></i><span class="clip">Auto Research · 工作空间</span></button>
   <div id="project"><div class="folder-sub"><i data-icon="chevron-down"></i><i data-icon="message-square"></i>会话<span class="fill"></span><span>23</span><i data-icon="plus"></i></div><div id="sessions"></div></div>
  </div>
  <div class="account"><span>Demo</span><span class="fill"></span><i data-icon="shield-user"></i><button type="button" class="ico" data-action="settings" data-icon="settings" aria-label="设置"></button></div>
 </aside>
 <main class="workspace" id="workspace">

  workspace.classList.remove(action==="expand"?"disk-only":"disk-wide");
  q("#expand").setAttribute("aria-pressed",String(action==="expand"&&active));render();break;
 }
 case "split":case "cite":case "analysis":case "fork":prepare(action);break;
 case "details":q("#drawer").hidden=true;if(!q("#inspector").hidden)inspect(true);else{mobile("graph");inspect();}break;
 case "unpin":setInput(field.value);break;
 case "replay":q("#drawer").hidden=true;startReplay();break;
 case "pause":pauseReplay(false);q("#drawer").hidden=true;break;
 case "close":q("#drawer").hidden=true;break;
 default:showDrawer(action);
 }
}
const beats=[
 [0,()=>setInput(opening)],
 [930,send],
 [1480,()=>overview()],
 [1210,()=>select("surface")],
 [1350,()=>prepare("split")],
 [1320,send],
 [1480,()=>{mobile("graph");render();emit("回放完成，可以继续探索。");}]
];
function nextBeat(){
 if(playState!=="playing")return;
 if(playStep>=beats.length){playState="idle";playStep=-1;syncPlay();return;}
 const [wait,execute]=beats[playStep];
 playTimer=setTimeout(()=>{if(playState!=="playing")return;execute();playStep++;nextBeat();},reduce.matches?Math.min(wait,300):wait);
}
function syncPlay(){if(window.parent!==window)window.parent.postMessage({type:"co-demo-status",state:playState},"*");}
function startReplay(force=false){
 if(force||playStep<0){resetDemo(false);playStep=0;}
 if(playState==="playing"&&!force)return;
 playState="playing";syncPlay();nextBeat();
}
addEventListener("message",e=>{
 if(window.parent===window||e.source!==window.parent||!e.data||e.data.type!=="co-demo-control")return;
 if(showcase){controlShowcase(e.data.command);return;}
 if(e.data.command==="start")startReplay();
 else if(e.data.command==="restart")startReplay(true);
 else if(e.data.command==="pause")pauseReplay(false);
 else if(e.data.command==="ping")syncPlay();
});
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-action],[data-node],[data-leaf],[data-pick],[data-child],[data-mobile-tab]");
 if(!el)return;
 if(el.dataset.action!=="replay")pauseReplay(false);
 if(el.dataset.action)action(el.dataset.action);
 else if(el.dataset.mobileTab)mobile(el.dataset.mobileTab);
 else if(el.dataset.node)select(el.dataset.node);
 else if(el.dataset.pick)select(el.dataset.pick,true);
 else if(el.dataset.child){select(el.dataset.parent,true);linked=el.dataset.child;render();}
 else if(el.dataset.leaf){linked=el.dataset.leaf;render();chart.querySelector('[data-leaf="'+linked+'"]')?.focus();emit(el.getAttribute("aria-label"));}
});
q("#composer").addEventListener("submit",e=>{e.preventDefault();pauseReplay(false);send();});
field.addEventListener("input",()=>{pauseReplay(false);updateInput();});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){
  if(!q("#drawer").hidden)q("#drawer").hidden=true;
  else if(!q("#inspector").hidden)inspect(true);
  else if(mode!=="empty")overview();
 }
 if(e.target.matches("#chart [tabindex]")&&(e.key==="Enter"||e.key===" ")){
  e.preventDefault();const id=e.target.dataset.node;
  e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}));
  if(id)chart.querySelector('[data-node="'+id+'"][tabindex="0"]')?.focus();
 }
});
let drag=null,suppressClick=false;
chart.addEventListener("pointerdown",e=>{if(mode==="overview"&&e.isPrimary&&e.button===0)drag={x:e.clientX,from:rotation,id:e.pointerId};});
chart.addEventListener("pointermove",e=>{
 if(!drag||e.pointerId!==drag.id||Math.abs(e.clientX-drag.x)<7&&!suppressClick)return;
 if(!suppressClick){suppressClick=true;chart.setPointerCapture(e.pointerId);pauseReplay(false);}
 rotation=(drag.from+(e.clientX-drag.x)*.6)%360;render();
});
function stopDrag(){drag=null;if(suppressClick)setTimeout(()=>{suppressClick=false},0);}
chart.addEventListener("pointerup",stopDrag);chart.addEventListener("pointercancel",stopDrag);
chart.addEventListener("click",e=>{if(suppressClick)e.stopPropagation();});
new ResizeObserver(()=>{cancelAnimationFrame(anim);anim=requestAnimationFrame(()=>render())}).observe(chart);
q("#sessions").innerHTML=trail.map((n,i)=>'<button data-action="'+(i===4?'frontier':'home')+'" type="button" class="session '+(i===0||i===2||i===3||i===6?'active ':'')+(i===3?'nest':'')+'">'+escaped(n)+'</button>').join("");
qa("[data-icon]").forEach(el=>{el.innerHTML=actionIcon(el.dataset.icon);});
// Stable geometry: the selected sector stays anchored while its two children unfold.
let showStep=0, showBeat=0, showState="idle", showTimer=0, deadline=0, remaining=0;
const showNames=["证据覆盖缺口","表面线索耦合"];
function agentLine(content, waiting=false){
 return '<div class="show-enter"><div class="agent-kicker"><i>'+actionIcon("book-open")+'</i>研究 Agent'+(waiting?'<span class="wait-pips"><b></b><b></b><b></b></span>':'')+'</div><div class="show-copy">'+content+'</div></div>';
}
function showItem(index,title,note, active=false, child=false, referenceLabel="已选中"){
 return '<div class="show-item show-enter '+(active?'active ':'')+(child?'child':'')+'"><span class="index">'+index+'</span><span><strong>'+title+'</strong><small>'+note+'</small></span>'+(active?'<em>'+referenceLabel+'</em>':'')+'</div>';
}
// Public-facing demonstration copy, not a prior conversation or evidence record.
// Separate public fixture for the passive promo; no account or research records are copied.
const showcaseProjects=[
 {id:"novelty",name:"AI 科研新颖性",sessions:[
  {id:"screen",name:"相关工作初筛"},
  {id:"novel-method",name:"新方法还是改写？"},
  {id:"validation",name:"方向 02 验证方案",parent:"novel-method"},
  {id:"rubric",name:"专家盲评量表"},
  {id:"rater",name:"评审一致性检查"},
  {id:"replication",name:"跨领域复测计划"}
 ]},
 {id:"retrieval",name:"文献检索评测",sessions:[
  {id:"coverage",name:"引文覆盖抽样"},{id:"gold",name:"相关文献标注"},
  {id:"budget",name:"检索预算对照"},{id:"errors",name:"漏检成因归类"}
 ]},
 {id:"reproduce",name:"实验复现与归档",sessions:[
  {id:"runtime",name:"运行环境记录"},{id:"seed",name:"随机种子复测"},{id:"artifacts",name:"复现材料清单"}
 ]}
];
const demoSession=showcaseProjects[0].sessions.find(session=>session.id==="novel-method");
const validationSession=showcaseProjects[0].sessions.find(session=>session.parent===demoSession.id);
function initShowcaseWorkspace(){
 q(".sidebar .sessions").innerHTML=showcaseProjects.map((project,i)=>{
  const expanded=i===0;
  return '<div class="fixture-project" data-fixture-project="'+project.id+'"><div class="folder">'+
   actionIcon(expanded?"chevron-down":"chevron-right")+actionIcon("folder")+
   '<span class="clip" title="'+escaped(project.name)+'">'+escaped(project.name)+'</span>'+
   '<span class="fixture-count">'+project.sessions.filter(s=>!s.parent).length+'</span></div>'+
   (expanded?project.sessions.map(session=>
    '<div class="fixture-session'+(session.id===demoSession.id?' current':'')+(session.parent?' child':'')+'" data-fixture-session="'+session.id+'"'+
    (session.id===demoSession.id?' aria-current="true"':'')+(session.parent?' hidden':'')+'>'+
    actionIcon(session.parent?"git-branch":"message-square")+
    '<span class="clip" title="'+escaped(session.name)+'">'+escaped(session.name)+'</span></div>'
   ).join(""):"")+'</div>';
 }).join("");
 q(".sidebar .account>span").textContent="演示工作区";
 const tabs=q(".chat .tabbar");
 const selected=tabs.querySelector(".tab.selected");
 selected.classList.add("fixture-tab","current");
 selected.querySelector(".clip").textContent=demoSession.name;
 const adjacent=[showcaseProjects[0].sessions[0],showcaseProjects[0].sessions.find(session=>session.id==="rubric")];
 [...tabs.querySelectorAll(".tab.muted")].forEach((tab,i)=>{
  if(!adjacent[i]){tab.remove();return;}
  tab.classList.add("fixture-tab");
  tab.innerHTML='<span class="clip">'+escaped(adjacent[i].name)+'</span>';
 });
 q(".composer .model").textContent="研究 Agent";
 q("#source").innerHTML="<b>来源策略</b>　示例论文摘要";
 q("#context-label").textContent="演示数据";
}
const comparisonNotes='<div class="show-prose show-enter"><p>要判断一个想法有没有新意，先把它提出的研究问题、借用的方法和预期贡献分开。然后找最接近的工作，问具体差异在哪一层。</p><ul><li><b>方向 01：</b>对照「只读摘要」和「补齐近邻文献」两组，记录有多少新颖性判断发生反转。</li><li><b>方向 02：</b>用同一方法的改写稿和同一术语下的不同方法做对照。</li></ul><div class="meta">2 组对照 · 待验证 '+actionIcon("chevron-right")+'</div></div>';
const focusNotes='<div class="show-prose show-enter"><p>先忘掉措辞，只比较方法是否等价：输入、核心步骤和适用条件有没有改变？如果三者都不变，只换术语不应被算成新方法。</p><p>下一步可以做两组对照：改写术语但保留方法，或保留术语但改变方法。判断两组时用同一份评审标准。</p></div>';
const receipt='<div class="compare-receipt show-enter"><span>方向组 · 2 个待验证方向</span><b>在工作区打开</b></div>';
function showList(active=false, label){
 return '<div class="show-list">'+showItem("01",showNames[0],"证据不足，会改变新颖性结论吗？")+showItem("02",showNames[1],"术语相似，方法也一定相同吗？",active,false,label)+'</div>';
}
function fitShowDisk(){chart.setAttribute("viewBox",matchMedia("(max-width: 720px)").matches?"6 122 565 468":"0 0 650 712");}
function showDisk(){
 const w=650,h=712,cy=356,cx=325;
 const focused=-168.75, r1=405;
 const base={dialW:w,dialH:h,topics:referenceTopics,rotation:0,linked:null};
 const overview=diskContent({...base,mode:"overview",picked:null,mounted:new Set()});
 const focus=diskContent({...base,mode:"focus",picked:"surface",mounted:new Set()},true);
 const leaf=(i,radius,a,name,subtitle,id,extra="")=>{
   const [x,y]=pt(focused,cy,radius,a);
   return '<g class="child-sector '+extra+'" data-show-child="'+id+'">'+
   path(wedge(focused,cy,475,654,a-6.4,a+6.4),"var(--dial-child,#20232d)","var(--dial-child-line,#71798b)",1)+
   tx(x,y-10,"02."+i,8,"var(--dial-muted,#a4a9b6)",'text-anchor="middle"')+
   tx(x,y+7,name,12,"var(--dial-ink,#f5f4f2)",'text-anchor="middle" font-weight="650"')+
   tx(x,y+22,subtitle,8,"var(--dial-muted,#a9aebc)",'text-anchor="middle"')+'</g>';
 };
 const origin=focused+r1,hub=origin+67;
 const edges='<path class="branch-edge" pathLength="1" d="M'+origin+' '+cy+' H'+hub+' M'+hub+' '+cy+' Q'+(hub+8)+' '+cy+' '+(hub+17)+' '+(cy-27)+' M'+hub+' '+cy+' Q'+(hub+8)+' '+cy+' '+(hub+17)+' '+(cy+27)+'" fill="none" stroke="var(--dial-connector,#bb9e6d)" stroke-width="1.35"/>';
 chart.setAttribute("viewBox","0 0 650 712");
 chart.setAttribute("preserveAspectRatio","xMidYMid meet");
 chart.setAttribute("role","img");
 chart.setAttribute("aria-label","对话研究图谱，方向总览与 L2 局部");
 const unique=(svg,suffix)=>svg.replace(/id="(dots|activeFill)"/g,'id="$1-'+suffix+'"').replace(/url\(#(dots|activeFill)\)/g,'url(#$1-'+suffix+')');
 chart.innerHTML='<g class="overview-scene">'+unique(overview,'overview')+'</g>'+
  '<g class="focus-scene">'+unique(focus,'focus')+'<g class="expansion" aria-label="新增两条子分支">'+edges+
  leaf(1,565,-7,"控制术语重合","对照试验","surface-1")+
  leaf(2,565,7,"检验方法等价","独立评审","surface-2","child-second")+'</g></g>';
 fitShowDisk();
}
function setShowStep(step){
 showStep=step;
 q("#layout").dataset.phase=String(step);
 q("#graphLabel").textContent=step===0?"研究目标 · "+showcaseProjects[0].name:step===1?demoSession.name+" · 方向组":"方向 02 · "+chip;
 const branch=q('[data-fixture-session="'+validationSession.id+'"]');
 branch.hidden=step<3;
 branch.classList.toggle("ready",step===3);
 q("#actions").hidden=step<2;
 q(".mini").hidden=step===0;
 q("#miniLabel").textContent=step<2?"已居中 · 0°":step===2?"L2 · 末梢 · 返回全景":"L2 · 2 分支 · 返回全景";
 q("#minimap").innerHTML='<circle cx="50" cy="50" r="47" fill="var(--dial-background,#111215)" stroke="var(--dial-hub-line,#504a3f)"/><circle cx="50" cy="50" r="39" fill="var(--dial-neutral,#1d1e22)" stroke="var(--dial-ring,#383a42)"/>'+ring(50,50,43,15)+path(wedge(50,50,15,40,step<2?-90:-39,step<2?90:39),"var(--dial-child,#414246)","var(--dial-child-line,#62636e)",.7)+'<circle cx="50" cy="50" r="10" fill="var(--dial-background,#101216)" stroke="var(--dial-hub-line,#bbb7ad)"/><path d="M45 50h10 M50 45v10 M67 50h8" stroke="var(--dial-accent,#b39f74)" stroke-width="1.1"/>';
}
const openQuestion="怎么判断 AI 提出的是新方法，还是只换了说法？";
const chip="表面线索耦合";
const initial='<div class="bubble show-enter">'+openQuestion+'</div>';
function showChat(content){
 messages.innerHTML=content;
 toBottom();
}
function showInit(){
 q("#layout").dataset.play=showState;
 document.documentElement.classList.add("showcase");
 workspace.inert=true;
 q(".sidebar").inert=true;
 document.querySelector('meta[name="color-scheme"]').content="light";
 q("#source").hidden=false;
 qa("[data-view=disk]").forEach(el=>el.setAttribute("aria-pressed","true"));
 field.placeholder="输入你的问题";
 setInput("");
 q("#pin").hidden=true;
 showChat("");
 setShowStep(0);
 showDisk();
}
const storyBeats=[
 [300,()=>setInput("怎么判断 AI")],
 [250,()=>setInput("怎么判断 AI 提出的是新方法")],
 [250,()=>setInput(openQuestion)],
 [390,()=>{setInput("");showChat(initial+agentLine("正在整理两条可比较的研究方向…",true));}],
 [1450,()=>{setShowStep(1);showChat(initial+agentLine("先区分证据不足和表述相似。我整理了两个可以单独验证的方向。")+comparisonNotes+receipt+showList());}],
 [3150,()=>{setShowStep(2);showChat('<div class="desktop-context">'+initial+receipt+'</div>'+agentLine("聚焦 02：表述相似，不一定代表方法相同。")+focusNotes+showList(true));}],
 [950,()=>{setInput("把 02 拆成可以验证的实验。","surface");q("#pin span").textContent="引用方向 · 02 "+chip;q(".show-item.active em").textContent="已引用";}],
 [2180,()=>{setInput("");showChat('<div class="bubble show-enter">把 02 拆成可以验证的实验。</div>'+agentLine("沿方向 02 设计两条验证路径…",true));}],
 [1300,()=>{setShowStep(3);showChat('<div class="desktop-context"><div class="bubble show-enter">把 02 拆成可以验证的实验。</div></div>'+agentLine("沿方向 02 生成两条子分支。")+showList(true,"已引用")+'<div class="show-branch show-enter"><b>02 的两条实验路径</b><div class="show-list">'+showItem("01","控制术语重合","验证表述是否影响判定",false,true)+showItem("02","检验方法等价","让专家独立比对方法",false,true)+'</div></div>');}],
 [3800,()=>{showState="done";}]
];
function reportShow(){
 q("#layout").dataset.play=showState;
 if(window.parent!==window)window.parent.postMessage({type:"co-product-motion",state:showState,step:showStep},"*");
}
function scheduleShow(){
 deadline=performance.now()+remaining;
 showTimer=setTimeout(()=>{
  if(showState!=="playing")return;
  const [,execute]=storyBeats[showBeat++];
  execute();
  reportShow();
  if(showBeat<storyBeats.length){remaining=storyBeats[showBeat][0];scheduleShow();}
 },remaining);
}
function controlShowcase(command){
 if(command==="ping"){reportShow();return;}
 if(command==="pause"&&showState==="playing"){
  clearTimeout(showTimer);remaining=Math.max(0,deadline-performance.now());showState="paused";reportShow();
 }else if(command==="restart"||(command==="start"&&showState==="idle")){
  clearTimeout(showTimer);showBeat=0;remaining=storyBeats[0][0];showInit();showState="playing";reportShow();scheduleShow();
 }else if(command==="start"&&showState==="paused"){
  showState="playing";reportShow();scheduleShow();
 }
}

if(showcase){initShowcaseWorkspace();showInit();reportShow();}else resetDemo(true);
</script>
